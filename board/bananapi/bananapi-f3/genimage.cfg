# SD card image for Banana Pi BPI-F3

image boot.vfat {
	vfat {
		files = {
			"Image",
			"bananapi-f3.dtb",
		}
	}
	size = 60M
}

image sdcard.img {
	hdimage {
		partition-table-type = "hybrid"
	}

	partition bootinfo {
		in-partition-table = "no"
		image = "bootinfo_sd.bin"
		offset = 0K
		size = 512
		holes = {"(80; 512)"}
	}

	partition fsbl {
		image = "FSBL.bin"
		offset = 128K
		size = 256K
	}

	partition u-boot-env {
		image = "u-boot-env.bin"
		offset = 384K
		size = 64K
	}

	partition opensbi {
		image = "fw_dynamic.itb"
		offset = 512K
		size = 256K
	}

	partition uboot {
		image = "u-boot.itb"
		offset = 1M
		size = 2M
	}

	partition kernel {
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
